name: Isolated signed publication preflight (Lean V2)

# No dispatch/PR/push entry point. The publisher calls an independently reviewed
# full SHA in a separate job, with no inherited secrets or caller-supplied code.
on:
  workflow_call:
    inputs:
      request:
        description: Dispatch operation object only; never commands, paths or transition targets
        type: string
        required: true
    secrets:
      VERIFICATION_APP_PRIVATE_KEY:
        description: Private key for the isolated Atlas Catalogue Verifier App
        required: true
    outputs:
      artifact-id:
        description: Public authorization bytes and Sigstore bundle only
        value: ${{ jobs.verify.outputs.artifact-id }}

permissions: {}
jobs:
  verify:
    if: >-
      github.repository == 'benchristian88/atlas-connectors' &&
      github.repository_id == '1414494920' &&
      github.repository_owner_id == '93822871' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'benchristian88/atlas-connectors/.github/workflows/catalogue-publish.yml@refs/heads/main' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: catalogue-verification
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require accepted independent trust pins before checkout or credentials
        id: context
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          VERIFICATION_POLICY: ${{ vars.VERIFICATION_POLICY }}
          ACCEPTANCE_ONLY: ${{ fromJSON(inputs.request).acceptance_only }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          try:
              job = json.loads(os.environ['JOB_CONTEXT'])
              trust = json.loads(os.environ['VERIFICATION_POLICY'])
              sha = trust['signer_revision']
              path = 'benchristian88/atlas-connectors/.github/workflows/catalogue-verifier.yml'
              if not (trust['schema'] == 'atlas-publication-verifier-trust/v2'
                      and type(trust['live_signer_accepted']) is bool
                      and (trust['live_signer_accepted'] or os.environ['ACCEPTANCE_ONLY'] == 'true')
                      and isinstance(sha, str) and re.fullmatch('[a-f0-9]{40}', sha)
                      and job['workflow_sha'] == sha
                      and job['workflow_ref'].count('@') == 1
                      and job['workflow_ref'].partition('@')[0] == path
                      and bool(job['workflow_ref'].partition('@')[2])
                      and job['workflow_repository'] == 'benchristian88/atlas-connectors'
                      and job['workflow_file_path'] == '.github/workflows/catalogue-verifier.yml'):
                  raise ValueError()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('revision=' + sha + '\n')
                  output.write('workflow_ref=' + job['workflow_ref'] + '\n')
          except Exception:
              sys.exit('verification_trust_not_accepted')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: benchristian88/atlas-connectors
          ref: ${{ steps.context.outputs.revision }}
          persist-credentials: false
      - name: Install only the pinned vendored SDK without dependencies or network
        run: python3 -m pip install --target "$RUNNER_TEMP/verifier-dependencies" --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
      - name: Observe security configuration and dispatch authority; issue one run preflight
        env:
          PYTHONPATH: ${{ runner.temp }}/verifier-dependencies
          AUTHORIZATION_REQUEST: ${{ inputs.request }}
          DISPATCH_OPERATION: ${{ github.event.inputs.operation }}
          DISPATCH_ACCEPTANCE_ONLY: ${{ github.event.inputs.acceptance_only }}
          VERIFIER_REVISION: ${{ steps.context.outputs.revision }}
          VERIFIER_WORKFLOW_REF: ${{ steps.context.outputs.workflow_ref }}
          VERIFICATION_POLICY: ${{ vars.VERIFICATION_POLICY }}
          VERIFICATION_APP_ID: ${{ vars.VERIFICATION_APP_ID }}
          VERIFICATION_APP_INSTALLATION_ID: ${{ vars.VERIFICATION_APP_INSTALLATION_ID }}
          VERIFICATION_APP_PRIVATE_KEY: ${{ secrets.VERIFICATION_APP_PRIVATE_KEY }}
        run: python3 tools/issue_publication_authorization.py
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        id: attest
        with:
          subject-path: ${{ runner.temp }}/publication-authorization/preflight.json
          predicate-type: https://atlas-impact.dev/attestations/publication-preflight/v2
          predicate-path: ${{ runner.temp }}/publication-authorization/predicate.json
          show-summary: false
          create-storage-record: false
          push-to-registry: false
      - name: Verify the new signer profile before exporting only public files
        env:
          PYTHONPATH: ${{ runner.temp }}/verifier-dependencies
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          AUTHORIZATION_REQUEST: ${{ inputs.request }}
          VERIFICATION_POLICY: ${{ vars.VERIFICATION_POLICY }}
        run: |
          python3 tools/prepare_publication_verifier.py
          python3 - <<'PY'
          import os, pathlib, sys, time
          sys.path.insert(0, 'tools')
          from atlas_connector_sdk.contracts import strict_json
          from authorization_sigstore import AuthorizationSigstore
          from publication_authorization import MAX_REQUEST_BYTES, check_request, parse
          from publication_contract import MAX_BUNDLE_BYTES
          from publication_verify import read_regular
          try:
              destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication-authorization'
              raw = read_regular(destination / 'preflight.json', 262144)
              bundle = read_regular(os.environ['BUNDLE_PATH'], MAX_BUNDLE_BYTES)
              trust = strict_json(os.environ['VERIFICATION_POLICY'], maximum=MAX_REQUEST_BYTES)
              value = parse(raw, 262144)
              source, execution = value['source'], value['execution']
              request = check_request({'source_commit': source['commit'], 'policy_sha256': source['policy_sha256'],
                  **{k: execution[k] for k in ('run_id', 'run_attempt', 'operation', 'acceptance_only')}})
              AuthorizationSigstore().verify(raw, bundle, expected=request, trust=trust)
              fresh = value['freshness']
              if not fresh['issued_at'] <= int(time.time()) < fresh['expires_at']:
                  raise ValueError()
              (destination / 'preflight.sigstore.json').write_bytes(bundle)
          except Exception:
              sys.exit('preflight_signature_not_accepted')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: publication-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/publication-authorization/preflight.json
            ${{ runner.temp }}/publication-authorization/preflight.sigstore.json
          if-no-files-found: error
          retention-days: 1
