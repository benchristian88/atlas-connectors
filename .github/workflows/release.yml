name: Immutable Connector release preparation
on:
  push:
    tags: ['proxmox-v*']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'benchristian88/atlas-connectors'
    runs-on: ubuntu-24.04
    environment: connector-release
    timeout-minutes: 10
    env:
      ATLAS_TEST_COLLECTIONS_PATH: /tmp/i4b-test-collections
      ATLAS_TEST_RUN_ANSIBLE: '1'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify independent Connector tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,json; assert os.environ['RELEASE_TAG'] == 'proxmox-v' + json.load(open('connectors/proxmox/manifest.json'))['version']"
      - name: Provision exact reviewed collection for source tests
        run: |
          curl --fail --silent --show-error --location https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/community-proxmox-2.0.0.tar.gz --output /tmp/community-proxmox-2.0.0.tar.gz
          python tools/test_collection.py --archive /tmp/community-proxmox-2.0.0.tar.gz --output "$ATLAS_TEST_COLLECTIONS_PATH"
      - run: python -m pytest -q
      - run: python tools/build_bundle.py
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/proxmox/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immutable-proxmox-release-candidate
          path: dist/proxmox/
          if-no-files-found: error
      # The protected operator workflow publishes these exact artifacts to a
      # draft immutable Release only after provenance qualification. This phase
      # prepares and attests; it does not create/publish GitHub Releases.
