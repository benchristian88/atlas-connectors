name: Connector validation
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATLAS_TEST_COLLECTIONS_PATH: /tmp/i4b-test-collections
      ATLAS_TEST_RUN_ANSIBLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Provision pinned offline publication verifier
        run: python tools/prepare_publication_verifier.py
      - name: Provision exact reviewed collection for source tests
        run: |
          curl --fail --silent --show-error --location https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/community-proxmox-2.0.0.tar.gz --output /tmp/community-proxmox-2.0.0.tar.gz
          python tools/test_collection.py --archive /tmp/community-proxmox-2.0.0.tar.gz --output "$ATLAS_TEST_COLLECTIONS_PATH"
      - run: python -m pytest -q
      - run: python tools/build_bundle.py
      - run: python tools/build_bundle.py --candidate
      - run: git diff --check
