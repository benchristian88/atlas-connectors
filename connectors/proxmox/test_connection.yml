- name: Test a Proxmox API-token connection
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Probe the declared connection
      atlas_probe:
        input_file: "{{ atlas_input_file }}"
        result_file: "{{ atlas_result_file }}"
      no_log: true
